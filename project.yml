name: Match3
options:
  bundleIdPrefix: io.kurrent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Match3Core:
    path: Packages/Match3Core

targets:
  Match3:
    type: application
    platform: iOS
    sources:
      - path: Match3
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Match3Core
    info:
      path: Match3/Resources/Info.plist
      properties:
        CFBundleDisplayName: Match 3
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: io.kurrent.match3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  Match3:
    build:
      targets:
        Match3: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Match3Core/Match3CoreTests
