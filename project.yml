name: Match3
options:
  bundleIdPrefix: io.anes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Match3Core:
    path: Packages/Match3Core

targets:
  Match3:
    type: application
    platform: iOS
    sources:
      - path: Match3
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Match3Core
    info:
      path: Match3/Resources/Info.plist
      properties:
        CFBundleDisplayName: Match 3
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: io.anes.match3
        DEVELOPMENT_TEAM: 59H75BATX8
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal

  Match3UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Match3UITests
      # The local store file, so PurchaseTests can drive StoreKitTest without the purchase sheet.
      - path: Match3.storekit
        buildPhase: resources
    dependencies:
      - target: Match3
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Match3

schemes:
  Match3:
    build:
      targets:
        Match3: all
        Match3UITests: [test]
    run:
      config: Debug
      # Local App Store: purchases in the Simulator go through this file, no App Store Connect needed.
      storeKitConfiguration: Match3.storekit
      # Debug-only switches (see Match3/App/DebugFlags.swift). Tick one in
      # Product > Scheme > Edit Scheme > Run > Arguments to use it.
      environmentVariables:
        - variable: MATCH3_PANEL
          value: "1"
          isEnabled: false
        - variable: MATCH3_AUTOSTART
          value: "1"
          isEnabled: false
        - variable: MATCH3_AUTOPLAY
          value: "1"
          isEnabled: false
        - variable: MATCH3_LEVEL
          value: "10"
          isEnabled: false
        - variable: MATCH3_ASSIST
          value: "2"
          isEnabled: false
        - variable: MATCH3_FORGET_SWIPE
          value: "1"
          isEnabled: false
        - variable: MATCH3_MUTE
          value: "1"
          isEnabled: false
        - variable: MATCH3_SESSION_SECONDS
          value: "20"
          isEnabled: false
        - variable: MATCH3_FREE_LEVELS
          value: "2"
          isEnabled: false
        - variable: MATCH3_UNLOCKED
          value: "1"
          isEnabled: false
        - variable: MATCH3_HIGH_CONTRAST
          value: "1"
          isEnabled: false
    test:
      config: Debug
      targets:
        - package: Match3Core/Match3CoreTests
        - Match3UITests
